# Local Test Configuration (all on localhost)

experiment:
  name: "local_test_flat"
  seed: 42

model_type: "mlp"
input_dim: 78
num_classes: 2

training:
  optimizer: "adam"
  lr: 0.001
  lr_scheduler: "none"
  batch_size: 32
  epochs: 5
  weight_decay: 0.0
  momentum: 0.9

learning:
  batch_size: 32
  epochs: 5
  lr: 0.001

federated:
  architecture: "flat"
  num_rounds_global: 3
  num_rounds_country: 5
  strategy: "fedavg"
  proximal_mu: 0.1
  trim_ratio: 0.1
  krum_num_malicious: 1
  krum_multi_k: 1

data:
  distribution: "iid"
  dirichlet_alpha: 0.5
  quantity_skew: false

defense:
  differential_privacy: false
  dp_epsilon: 1.0
  dp_delta: 1.0e-5
  gradient_clipping: false
  clip_norm: 1.0
  contribution_eval: false
  contribution_threshold: 0.5

network:
  global_server:
    ip: "127.0.0.1"
    port: 8080

  countries:
    country_A:
      ip: "127.0.0.1"
      port: 8081
      clients:
        - "Client_01"
        - "Client_02"
        - "Client_03"
    country_B:
      ip: "127.0.0.1"
      port: 8082
      clients:
        - "Client_04"
        - "Client_05"
        - "Client_06"
    country_C:
      ip: "127.0.0.1"
      port: 8083
      clients:
        - "Client_07"
        - "Client_08"
        - "Client_09"

  attacker:
    ip: "127.0.0.1"

dashboard:
  port: 8050
  refresh_interval_ms: 1000

anomaly:
  enabled: true
  top_k: 20

drift:
  enabled: false
  window_size: 5
  threshold: 0.05

poison_detection:
  enabled: false
  sensitivity: 0.8