# Default Experiment Configuration

experiment:
  name: "default_experiment"
  seed: 42

model_type: "mlp"
input_dim: 78
num_classes: 2

training:
  optimizer: "adam"
  lr: 0.001
  lr_scheduler: "none"
  batch_size: 32
  epochs: 5
  weight_decay: 0.0
  momentum: 0.9

learning:
  batch_size: 32
  epochs: 5
  lr: 0.001

federated:
  num_rounds_global: 3
  num_rounds_country: 5
  strategy: "fedavg"
  proximal_mu: 0.1
  proximal_mu_adaptive: true  # Reduce mu for complex models (LSTM, ResNet)
  trim_ratio: 0.1
  krum_num_malicious: 1
  krum_multi_k: 1
  client_timeout: 600  # Increased from 500s to handle CNN/LSTM training

data:
  distribution: "iid"
  dirichlet_alpha: 0.5
  quantity_skew: false

defense:
  differential_privacy: false
  dp_epsilon: 1.0
  dp_delta: 1.0e-5
  gradient_clipping: false
  clip_norm: 1.0
  contribution_eval: false
  contribution_threshold: 0.5

# Client -> Country assignments (for simulation/run_experiment.py)
hierarchy:
  country_A:
    clients:
      - "Client_01"
      - "Client_02"
    port: 8081
  country_B:
    clients:
      - "Client_03"
      - "Client_04"
      - "Client_05"
    port: 8082

global_server:
  host: "127.0.0.1"
  port: 8080
