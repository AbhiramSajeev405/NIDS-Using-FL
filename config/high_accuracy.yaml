# High Accuracy Configuration
# Increases training epochs and rounds for better convergence

experiment:
  name: "high_accuracy"
  seed: 42

model_type: "mlp"
input_dim: 78
num_classes: 2

training:
  optimizer: "adam"
  lr: 0.0005          # Lower learning rate for stability
  lr_scheduler: "cosine"
  batch_size: 128     # Smaller = better gradient estimation
  epochs: 10          # 10x more local training!
  weight_decay: 0.0001

federated:
  architecture: "flat"
  num_rounds_global: 30  # 10x more rounds!
  strategy: "fedavg"
  proximal_mu: 0.1
  trim_ratio: 0.1
  krum_num_malicious: 1
  krum_multi_k: 1

personalization:
  enabled: false
  epochs: 3
  lr: 0.0001

data:
  distribution: "iid"
  dirichlet_alpha: 1.0  # More even distribution
  quantity_skew: false

defense:
  differential_privacy: false
  gradient_clipping: false

anomaly:
  enabled: false

drift:
  enabled: false

poison_detection:
  enabled: false

network:
  global_server:
    ip: "127.0.0.1"
    port: 456
  countries:
    country_A:
      ip: "127.0.0.1"
      port: 27566
      clients:
        - "Client_01"
        - "Client_02"
        - "Client_03"
    country_B:
      ip: "127.0.0.1"
      port: 27567
      clients:
        - "Client_04"
        - "Client_05"
        - "Client_06"
    country_C:
      ip: "127.0.0.1"
      port: 27568
      clients:
        - "Client_07"
        - "Client_08"
        - "Client_09"
  attacker:
    ip: "127.0.0.1"
    scenario: "none"
    injection_mode: "offline"

dashboard:
  port: 456
  bind: "0.0.0.0"
  refresh_interval_ms: 1000
